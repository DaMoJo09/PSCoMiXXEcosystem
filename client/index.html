    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {

        });

          names.forEach(function(name) { caches.delete(name); });
        });

        if (splash && splash.parentNode) {
          splash.innerHTML = '<div style="text-align:center;padding:2rem;">' +
            '<p style="color:#fff;font-family:sans-serif;margin-bottom:1rem;">Loading is taking longer than expected.</p>' +
            '<button style="background:#06b6d4;color:#000;border:none;padding:0.75rem 1.5rem;border-radius:8px;font-weight:bold;cursor:pointer;" id="refreshBtn">Refresh</button></div>';
          var btn = document.getElementById('refreshBtn');
          if (btn) btn.addEventListener('click', function() { location.reload(); });
        }
