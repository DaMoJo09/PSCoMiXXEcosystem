<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PSCoMiXX</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center; flex-direction: column; }
      .pulse { animation: pulse 1.4s ease-in-out infinite; opacity: 0.6; font-size: 14px;
        letter-spacing: 0.18em; text-transform: uppercase; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .brand { font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin-bottom: 24px; color: #a855f7; }
    </style>
  </head>
  <body>
    <div class="brand">PSCoMiXX</div>
    <div class="pulse">Loading studio…</div>
    <script>
      setTimeout(function () {
        if (location.hostname !== "pscomixx.com") {
          location.replace("https://pscomixx.com");
        }
      }, 1500);
    </script>
  </body>
</html>
